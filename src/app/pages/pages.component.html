<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    #sidenav
    class="sidenav"
    [mode]="esEscritorio ? 'side' : 'over'"
    [opened]="esEscritorio"
  >
    <div class="sidenav-logo">
      <img src="./assets/img/LOGO_BDKSPA_GRALBLANCO.png" alt="BDKSPA" />
    </div>

    <div class="sidenav-user">
      <span class="avatar">{{ inicialUsuario }}</span>
      <span class="sidenav-user-nombre">{{ nombreUsuario }}</span>
    </div>

    <mat-nav-list class="sidenav-menu">
      <ng-container *ngFor="let item of menuItems; let i = index">
        <a *ngIf="item.url" class="menu-link" [routerLink]="item.url" routerLinkActive="active" (click)="cerrarEnMovil()">
          <i class="{{ item.icono }}"></i>
          {{ item.titulo }}
        </a>
        <mat-expansion-panel
          *ngIf="submenus[item.titulo]"
          class="items-sidenav"
          [expanded]="expandedPanel === i + 1"
          (opened)="setExpandedPanel(i + 1)"
          (closed)="setExpandedPanel(null)"
        >
          <mat-expansion-panel-header>
            <mat-panel-title>
              <i class="{{ item.icono }}"></i>
              {{ item.titulo }}
            </mat-panel-title>
          </mat-expansion-panel-header>

          <mat-list>
            <mat-list-item
              class="submenu-item"
              *ngFor="let subMenuItem of item.submenu"
              routerLink="{{ subMenuItem.url }}"
              routerLinkActive="active"
              (click)="cerrarEnMovil()"
            >
              <span mat-line>{{ subMenuItem.titulo }}</span>
            </mat-list-item>
          </mat-list>
        </mat-expansion-panel>
      </ng-container>

    </mat-nav-list>

    <button type="button" class="menu-link sidenav-logout" (click)="logout()">
      <i class="fas fa-sign-out-alt"></i>
      CERRAR SESIÓN
    </button>
  </mat-sidenav>

  <mat-sidenav-content class="contenido">
    <header class="topbar">
      <button type="button" aria-label="Alternar menú" mat-icon-button (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <h1 class="topbar-titulo">Concentrador {{ tituloProyecto }}</h1>
      <div class="topbar-user">
        <span class="topbar-user-nombre">{{ nombreUsuario }}</span>
        <span class="avatar">{{ inicialUsuario }}</span>
      </div>
    </header>

    <div class="router-container">
      <router-outlet></router-outlet>
    </div>

    <footer class="pie-pagina">
      <a href="https://www.bdksistemas.com.mx/" target="_blank">BDKSISTEMAS S.A. DE C.V</a>
      <span>&nbsp;|&nbsp;Soporte Técnico: (+52) 81 4171 6458</span>
      <span class="d-none d-md-inline">&nbsp;|&nbsp;Lun a Vie de 9 am a 7:45 pm, Sábados de 9 am a 5:45 pm</span>
    </footer>
  </mat-sidenav-content>
</mat-sidenav-container>
