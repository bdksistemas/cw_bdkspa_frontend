<div class="container-all">


  <div class="mat-elevation-z8">
    <app-titulo-pagina [titulo]="titulo"></app-titulo-pagina>

    <div class="demo-button-container">
      <mat-form-field class="buscador-ticket buscador-item">
        <input matInput (keyup)="applyFilter($event.target)" placeholder="Buscar:">
      </mat-form-field>

      <div class="">
        <button (click)="downloadPDF()" mat-raised-button class="botones-acciones rojo" >
          PDF <i class="fas fa-download ml-3"></i>
        </button>
      </div>
      <div class="">
        <button (click)="downloadExcel()" mat-raised-button class="botones-acciones verde" [color]="verde">
          EXCEL <i class="fas fa-download ml-3"></i>
        </button>
      </div>


      <div class="form-floating buscador-ticket">
          <input type="date" class="form-control box-shadow-rojo borde-rojo"
          [(ngModel)]="fechaInicial"
          (change)="validarFechaInicial($event.target)"
          >
          <label for="floatingSelect">Fecha Inicial</label>
      </div>

      <div class="form-floating buscador-ticket">
        <input type="date" class="form-control box-shadow-rojo borde-rojo  "
        [(ngModel)]="fechaFinal"
        (change)="validarFechaFinal($event.target)"
        >
        <label for="floatingSelect">Fecha Final</label>
      </div>

      <div class="form-floating buscador-ticket">
        <select (change)="cambioSucusal($event)" class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
          @for (item of sucursales; track $index) {
            <option value="{{item.sucursal}}">{{item.empresa}} </option>
          }
        </select>
        <label for="floatingSelect">Selecciona Sucursal</label>
      </div>

      <div class="form-floating buscador-ticket">
        <select (change)="cambioTipoMovimiento($event)"   class="form-select box-shadow-rojo borde-rojo" id="floatingSelect2" aria-label="Floating label select example">
          <option value="null">TODOS</option>
          @for (item of tipoTrataniento; track $index) {
            <option value="{{item.producto}}">{{item.nomproducto}}</option>
          }
        </select>
        <label for="floatingSelect">Selecciona Tratamiento</label>
      </div>
      <!-- <div class="form-floating buscador-ticket">
        <select (change)="cambioTipoSuscripcion($event)"   class="form-select box-shadow-rojo borde-rojo" id="floatingSelect3" aria-label="Floating label select example">
          <option value="999">TODOS</option>
          @for (item of tiposSuscripcion; track $index) {
            <option value="{{item.modopago}}">{{item.nommodopago}}</option>
          }
        </select>
        <label for="floatingSelect">Tipo de Suscripción</label>
      </div> -->
    </div>
    <table id="my-table" mat-table [dataSource]="dataSource" matSort >


      <ng-container matColumnDef="Ticket">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Ticket</th>
        <td mat-cell *matCellDef="let row"> {{ row.Ticket }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>
      <ng-container matColumnDef="Fecha">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha</th>
        <td mat-cell *matCellDef="let row"> {{ row.Fecha }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="NombreCliente">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre Cliente</th>
        <td mat-cell *matCellDef="let row"> {{ row.NombreCliente }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="Tratamiento">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Tratamiento</th>
        <td mat-cell *matCellDef="let row"> {{ row.Tratamiento }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="Sesiones">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Sesiones</th>
        <td mat-cell *matCellDef="let row"> {{ row.Sesiones }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="Tomadas">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Tomadas</th>
        <td mat-cell *matCellDef="let row"> {{ row.Tomadas }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="UltimaSesion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Última Sesión</th>
        <td mat-cell *matCellDef="let row"> {{ row.UltimaSesion }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="ProximaSesion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Próxima Sesión</th>
        <td mat-cell *matCellDef="let row"> {{ row.ProximaSesion }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="Vigencia">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Vigencia</th>
        <td mat-cell *matCellDef="let row"> {{ row.Vigencia }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>




      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns; sticky: true"></tr>

    </table>

    <mat-paginator pageSize="10" [pageSizeOptions]="[5, 10, 25, 100]" class="items-center" ></mat-paginator>
  </div>
  <app-banner-publicitario></app-banner-publicitario>
  <!-- <app-footer></app-footer> -->

</div>
