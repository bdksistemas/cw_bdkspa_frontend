<div class="container-all ">


  <div class="mat-elevation-z8">
    <app-titulo-pagina [titulo]="titulo"></app-titulo-pagina>

    <div class="demo-button-container">
      <mat-form-field class="buscador-ticket buscador-item">
        <input matInput (keyup)="applyFilter($event.target)" placeholder="Buscar datos: ">
      </mat-form-field>

      <div class="">
        <button (click)="downloadPDF()" mat-raised-button class="botones-acciones rojo" >
          PDF <i class="fas fa-download ml-3"></i>
        </button>
      </div>
      <div class="">
        <button (click)="downloadExcel()" mat-raised-button class="botones-acciones verde" [color]="verde">
          EXCEL <i class="fas fa-download ml-3"></i>
        </button>
      </div>


      <div class="form-floating buscador-ticket">
          <input type="date" class="form-control box-shadow-rojo borde-rojo"
          [(ngModel)]="fechaInicial"
            (change)="validarFechaInicial($event.target)"
          >
          <label for="floatingSelect">Selecciona Dia:</label>
      </div>

      <!-- <div class="form-floating buscador-ticket">
        <input type="date" class="form-control box-shadow-rojo borde-rojo  "
        [(ngModel)]="fechaFinal"
        (change)="validarFechaFinal($event.target)"
        >
        <label for="floatingSelect">Fecha Final</label>
      </div> -->

      <div class="form-floating buscador-ticket">
        <select (change)="cambioSucusal($event)" class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
          @for (item of sucursales; track $index) {
            <option value="{{item.sucursal}}">{{item.empresa}} </option>
          }
        </select>
        <label for="floatingSelect">Selecciona Sucursal:</label>
      </div>

      <div class="form-floating buscador-ticket">
        <select (change)="cambioSala($event)" class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
          <option value="null">SELECCIONA UNA SALA</option>
          @for (item of salas; track $index) {
            <option value="{{item.sala}}">{{item.nomsala}} </option>
          }
        </select>
        <label for="floatingSelect">Selecciona Sala:</label>
      </div>
    </div>
    <table id="my-table" mat-table [dataSource]="dataSource" matSort >

      <!-- displayedColumns: any[] = [
            'NumeroSesion',
            'Hora',
            'Tratamiento',
            'Cliente',
            'Empleado',
            'Comentarios',
        ]; -->

        <ng-container matColumnDef="NumeroSesion">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Número de Sesión </th>
          <td mat-cell *matCellDef="let element"> {{element.NumeroSesion}} </td>
          <td mat-footer-cell *matFooterCellDef> </td>

        </ng-container>

        <ng-container matColumnDef="Hora">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Hora </th>
          <td mat-cell *matCellDef="let element"> {{element.Hora}} </td>
          <td mat-footer-cell *matFooterCellDef> </td>

        </ng-container>

        <ng-container matColumnDef="Tratamiento">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Tratamiento </th>
          <td mat-cell *matCellDef="let element"> {{element.Tratamiento}} </td>
          <td mat-footer-cell *matFooterCellDef> </td>

        </ng-container>

        <ng-container matColumnDef="Cliente">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Cliente </th>
          <td mat-cell *matCellDef="let element"> {{element.Cliente}} </td>
          <td mat-footer-cell *matFooterCellDef> </td>

        </ng-container>

        <ng-container matColumnDef="Empleado">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Empleado </th>
          <td mat-cell *matCellDef="let element"> {{element.Empleado}} </td>
          <td mat-footer-cell *matFooterCellDef> </td>

        </ng-container>

        <ng-container matColumnDef="Comentarios">
          <th mat-header-cell *matHeaderCellDef mat-sort-header> Comentarios </th>
          <td mat-cell *matCellDef="let element"> {{element.Comentarios}} </td>
          <td mat-footer-cell *matFooterCellDef> </td>

        </ng-container>



      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns; sticky: true"></tr>

    </table>

    <!-- <mat-paginator pageSize="10" [pageSizeOptions]="[5, 10, 25, 100]" class="items-center" ></mat-paginator> -->
  </div>
  <app-banner-publicitario></app-banner-publicitario>

</div>
