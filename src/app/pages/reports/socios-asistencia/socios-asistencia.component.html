<div class="container-all">


  <div class="mat-elevation-z8">
    <app-titulo-pagina [titulo]="titulo"></app-titulo-pagina>

    <div class="demo-button-container">
      <mat-form-field class="buscador-ticket buscador-item">
        <input matInput (keyup)="applyFilter($event.target)" placeholder="Buscar datos">
      </mat-form-field>

      <div class="">
        <button (click)="downloadPDF()" mat-raised-button class="botones-acciones rojo" >
          PDF <i class="fas fa-download ml-3"></i>
        </button>
      </div>
      <div class="">
        <button (click)="downloadExcel()" mat-raised-button class="botones-acciones verde" [color]="verde">
          EXCEL <i class="fas fa-download ml-3"></i>
        </button>
      </div>

      <!-- <div class="form-floating buscador-ticket">
        <select  class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
            <option value="0">ACTIVOS</option>
            <option value="1">CANCELADOS</option>
        </select>
        <label for="floatingSelect">Estatus Ticket</label>
      </div> -->

      <div class="form-floating buscador-ticket">
          <input
            type="date"
            class="form-control box-shadow-rojo borde-rojo"
            [(ngModel)]="fechaInicial"
            (change)="validarFechaInicial($event.target)"
            >
          <label for="floatingSelect">Fecha Inicial</label>
      </div>

      <div class="form-floating buscador-ticket">
        <input type="date"
          class="form-control box-shadow-rojo borde-rojo"
          [(ngModel)]="fechaFinal"
          (change)="validarFechaFinal($event.target)"

          >
        <label for="floatingSelect">Fecha Final</label>
      </div>

      <div class="form-floating buscador-ticket">
        <select (change)="cambioSucusal($event)" class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
          @for (item of sucursales; track $index) {
            <option value="{{item.sucursal}}">{{item.empresa}} </option>
          }
        </select>
        <label for="floatingSelect">Selecciona Sucursal</label>
      </div>

      <div class="form-floating buscador-ticket">
        <select (change)="cambioClase($event)"  class="form-select box-shadow-rojo borde-rojo" id="floatingSelect2" aria-label="Floating label select example">
          <option value="0" >SELECCIONA UNA CLASE</option>
          @for (item of clases; track $index) {
            <option value="{{item.clase}}">{{item.nomclase}} </option>
          }
        </select>
        <label for="floatingSelect2">Selecciona Clase</label>
      </div>

    </div>

    <table id="my-table" mat-table [dataSource]="dataSource" matSort >



      <ng-container matColumnDef="Fecha">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha </th>
        <td mat-cell *matCellDef="let row"> {{row.Fecha}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <ng-container matColumnDef="IDSocio">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID Socio </th>
        <td mat-cell *matCellDef="let row"> {{row.IDSocio}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <ng-container matColumnDef="NombreSocio">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre Socio </th>
        <td mat-cell *matCellDef="let row"> {{row.NombreSocio}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>

      </ng-container>

      <ng-container matColumnDef="NombreClase">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre Clase </th>
        <td mat-cell *matCellDef="let row"> {{row.NombreClase}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <ng-container matColumnDef="HoraAsistencia">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Hora Asistencia </th>
        <td mat-cell *matCellDef="let row"> {{row.HoraAsistencia}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <ng-container matColumnDef="Instructor">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Instructor </th>
        <td mat-cell *matCellDef="let row"> {{row.Instructor}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <ng-container matColumnDef="Autorizo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Autorizo </th>
        <td mat-cell *matCellDef="let row"> {{row.Autorizo}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <ng-container matColumnDef="Motivo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Motivo </th>
        <td mat-cell *matCellDef="let row"> {{row.Motivo}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns; sticky: true"></tr>

    </table>

    <mat-paginator pageSize="10" [pageSizeOptions]="[5, 10, 25, 100]" class="items-center" ></mat-paginator>
  </div>


  <app-banner-publicitario ></app-banner-publicitario>

</div>
