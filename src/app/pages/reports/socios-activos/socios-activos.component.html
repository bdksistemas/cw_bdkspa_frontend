<div class="container-all">


  <div class="mat-elevation-z8">
    <app-titulo-pagina [titulo]="titulo"></app-titulo-pagina>

    <div class="demo-button-container">
      <mat-form-field class="buscador-ticket buscador-item">
        <input matInput (keyup)="applyFilter($event.target)" placeholder="Buscar socios">
      </mat-form-field>

      <div class="">
        <button (click)="downloadPDF()" mat-raised-button class="botones-acciones rojo" >
          PDF <i class="fas fa-download ml-3"></i>
        </button>
      </div>
      <div class="">
        <button (click)="downloadExcel()" mat-raised-button class="botones-acciones verde" [color]="verde">
          EXCEL <i class="fas fa-download ml-3"></i>
        </button>
      </div>


      <div class="form-floating buscador-ticket">
          <input
            type="date"
            class="form-control box-shadow-rojo borde-rojo"
            [(ngModel)]="fechaInicial"
            (change)="validarFechaInicial($event.target)"
            >
          <label for="floatingSelect">Fecha Inicial</label>
      </div>

      <div class="form-floating buscador-ticket">
        <input type="date"
          class="form-control box-shadow-rojo borde-rojo"
          [(ngModel)]="fechaFinal"
          (change)="validarFechaFinal($event.target)"

          >
        <label for="floatingSelect">Fecha Final</label>
      </div>

      <div class="form-floating buscador-ticket">
        <select (change)="cambioSucusal($event)" class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
          @for (item of sucursales; track $index) {
            <option value="{{item.sucursal}}">{{item.empresa}} </option>
          }
        </select>
        <label for="floatingSelect">Selecciona Sucursal</label>
      </div>

      <div class="form-floating buscador-ticket">
        <select (change)="cambioCategoria($event)" class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
          @for (item of categorias; track $index) {
            <option value="{{item.categoria}}">{{item.nomcategoria}} </option>
          }
        </select>
        <label for="floatingSelect">Selecciona Categoría</label>
      </div>
      <!-- <div class="form-check">
        <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
        <label class="form-check-label" for="flexCheckDefault">
          Mostrar Cancelados
        </label>
      </div> -->
    </div>

    <table id="my-table" mat-table [dataSource]="dataSource" matSort >

      <!-- displayedColumns: any[] = [
    'FechaAlta',
    'NombreCliente',
    'Celular',
    'Categoria',
    'Saldo',
    'UltimoMovimiento',
    'DiasInactivo',
  ]; -->

      <ng-container matColumnDef="FechaAlta">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha de Alta </th>
        <td mat-cell *matCellDef="let row"> {{row.FechaAlta}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>
      <ng-container matColumnDef="NombreCliente">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre del Cliente </th>
        <td mat-cell *matCellDef="let row"> {{row.NombreCliente}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <ng-container matColumnDef="Celular">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Celular </th>
        <td mat-cell *matCellDef="let row"> {{row.Celular}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <ng-container matColumnDef="Categoria">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Categoría </th>
        <td mat-cell *matCellDef="let row"> {{row.Categoria}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <ng-container matColumnDef="Saldo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Saldo </th>
        <td mat-cell *matCellDef="let row"> {{row.Saldo | currency}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <ng-container matColumnDef="UltimoMovimiento">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Último Movimiento </th>
        <td mat-cell *matCellDef="let row"> {{row.UltimoMovimiento}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <ng-container matColumnDef="DiasInactivo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Días Inactivo </th>
        <td mat-cell *matCellDef="let row"> {{row.DiasInactivo}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <!-- <ng-container matColumnDef="Ticket">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Ticket </th>
        <td mat-cell *matCellDef="let row"> {{row.Ticket}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container> -->




      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns; sticky: true"></tr>

    </table>

    <mat-paginator pageSize="10" [pageSizeOptions]="[5, 10, 25, 100]" class="items-center" ></mat-paginator>
  </div>


  <app-banner-publicitario ></app-banner-publicitario>

</div>
