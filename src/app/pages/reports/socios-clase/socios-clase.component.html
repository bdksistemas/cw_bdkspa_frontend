<div class="container-all">
  <div class="mat-elevation-z8">
    <app-titulo-pagina [titulo]="titulo"></app-titulo-pagina>

    <div class="demo-button-container">
      <mat-form-field class="buscador-ticket buscador-item">
        <input
          matInput
          (keyup)="applyFilter($event.target)"
          placeholder="Buscar datos: "
        />
      </mat-form-field>

      <div class="">
        <button
          (click)="downloadPDF()"
          mat-raised-button
          class="botones-acciones rojo"
        >
          PDF <i class="fas fa-download ml-3"></i>
        </button>
      </div>
      <div class="">
        <button
          (click)="downloadExcel()"
          mat-raised-button
          class="botones-acciones verde"
          [color]="verde"
        >
          EXCEL <i class="fas fa-download ml-3"></i>
        </button>
      </div>

      <div class="form-floating buscador-ticket">
        <select
          (change)="cambioSucusal($event)"
          class="form-select box-shadow-rojo borde-rojo"
          id="floatingSelect"
          aria-label="Floating label select example"
        >
          @for (item of sucursales; track $index) {
          <option value="{{ item.sucursal }}">{{ item.empresa }}</option>
          }
        </select>
        <label for="floatingSelect">Selecciona Sucursal</label>
      </div>

      <div class="form-floating buscador-ticket">
        <select
          (change)="cambioClaseNuevo($event)"
          class="form-select box-shadow-rojo borde-rojo"
          id="floatingSelect2"
          aria-label="Floating label select example"
        >
          <option value="0">SELECCIONA CLASE</option>
          @for (item of clases; track $index) {
          <option value="{{ item.clase }}">
            {{ item.nomclase.trim() }} - <b>SOCIOS:</b> {{ item.numeroSocios }}
          </option>
          }
        </select>
        <label for="floatingSelect2">Selecciona Clase</label>
      </div>
      <div class="form-floating buscador-ticket">
        <select
          (change)="cambioHorarioNuevo($event)"
          class="form-select box-shadow-rojo borde-rojo"
          id="floatingSelect3"
          aria-label="Floating label select example"
        >
          <option value="0">SELECCIONA HORARIO</option>

          @for (item of horarios; track $index) {
          <option value="{{ item.id }}">
            {{ this.interPretacionDias[item.dia].abrev }} -
            {{ this.interpretacionHora(item.hora) }}
          </option>
          }
        </select>
        <label for="floatingSelect3">Selecciona Horario</label>
      </div>
    </div>

    <table id="my-table" mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="Clase">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Clase</th>
        <td mat-cell *matCellDef="let row">{{ row.Clase }}</td>
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>

      <ng-container matColumnDef="Horario">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Horario</th>
        <td mat-cell *matCellDef="let row">{{ row.Horario }}</td>
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>

      <ng-container matColumnDef="IDSocio">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID Socio</th>
        <td mat-cell *matCellDef="let row">{{ row.IDSocio }}</td>
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>

      <ng-container matColumnDef="NombreSocio">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre Socio</th>
        <td mat-cell *matCellDef="let row">{{ row.NombreSocio }}</td>
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns; sticky: true"></tr>

              <!-- Fila para mostrar mensaje cuando no hay datos -->
        <tr *ngIf="dataSource.data.length === 0">
          <td [attr.colspan]="displayedColumns.length" class="empty-row">No hay datos disponibles</td>
        </tr>
    </table>


    <mat-paginator
      pageSize="10"
      [pageSizeOptions]="[5, 10, 25, 100]"
      class="items-center"
    ></mat-paginator>
  </div>

  <app-banner-publicitario></app-banner-publicitario>
</div>
