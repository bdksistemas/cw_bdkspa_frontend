<div class="container-all ">


  <div class="mat-elevation-z8">
    <app-titulo-pagina [titulo]="titulo"></app-titulo-pagina>

    <div class="demo-button-container">
      <mat-form-field class="buscador-ticket buscador-item">
        <input matInput (keyup)="applyFilter($event.target)" placeholder="Buscar datos ingresos">
      </mat-form-field>

      <div class="">
        <button (click)="downloadPDF()" mat-raised-button class="botones-acciones rojo" >
          PDF <i class="fas fa-download ml-3"></i>
        </button>
      </div>
      <div class="">
        <button (click)="downloadExcel()" mat-raised-button class="botones-acciones verde" [color]="verde">
          EXCEL <i class="fas fa-download ml-3"></i>
        </button>
      </div>


      <div class="form-floating buscador-ticket">
          <input type="date" class="form-control box-shadow-rojo borde-rojo"
          [(ngModel)]="fechaInicial"
            (change)="validarFechaInicial($event.target)"
          >
          <label for="floatingSelect">Fecha Inicial:</label>
      </div>

      <div class="form-floating buscador-ticket">
        <input type="date" class="form-control box-shadow-rojo borde-rojo  "
        [(ngModel)]="fechaFinal"
        (change)="validarFechaFinal($event.target)"
        >
        <label for="floatingSelect">Fecha Final:</label>
      </div>

      <div class="form-floating buscador-ticket">
        <select (change)="cambioSucusal($event)" class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
          @for (item of sucursales; track $index) {
            <option value="{{item.sucursal}}">{{item.empresa}} </option>
          }
        </select>
        <label for="floatingSelect">Selecciona Sucursal:</label>
      </div>

      <div class="form-floating buscador-ticket">
        <select (change)="cambioTipoMovimiento($event)"   class="form-select box-shadow-rojo borde-rojo" id="floatingSelect2" aria-label="Floating label select example">
          <option value="null">TODOS</option>
          @for (item of tipoTrataniento; track $index) {
            <option value="{{item.producto}}">{{item.nomproducto}}</option>
          }
        </select>
        <label for="floatingSelect">Tratamiento:</label>
      </div>
      <div class="form-floating buscador-ticket">
        <select (change)="cambioEmpleado($event)"   class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
          <option value="0">SELECCIONA UN EMPLEADO</option>
          @for (item of cajeros; track $index) {
            <option value="{{item.idusuario}}">{{item.nombre}} </option>
          }
        </select>
        <label for="floatingSelect">Empleado:</label>
      </div>
    
   <!--
      <div class="form-floating buscador-ticket">
        <select  class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
          <option value="0">SELECCIONA UN PROVEDOR</option>
        </select>
        <label for="floatingSelect">PROVEDOR</label>
      </div>

      <div class="form-floating buscador-ticket">
        <select  class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
          <option value="0">SELECCIONA UN USUARIO</option>
        </select>
        <label for="floatingSelect">USUARIO</label>
      </div> -->

    <table id="my-table" mat-table [dataSource]="dataSource" matSort >
      <!-- displayedColumns: any[] = [

      'Fecha',
      'Cliente',
      'Tratamiento',
      'Sesiones',
      'Sala',
      'Empleado',
    ]; -->

    <ng-container matColumnDef="Fecha">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha </th>
      <td mat-cell *matCellDef="let element"> {{element.Fecha}} </td>
      <td mat-footer-cell *matFooterCellDef>  </td>
    </ng-container>

    <ng-container matColumnDef="Cliente">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Cliente </th>
      <td mat-cell *matCellDef="let element"> {{element.Cliente}} </td>
      <td mat-footer-cell *matFooterCellDef>  </td>
    </ng-container>

    <ng-container matColumnDef="Tratamiento">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Tratamiento </th>
      <td mat-cell *matCellDef="let element"> {{element.Tratamiento}} </td>
      <td mat-footer-cell *matFooterCellDef> </td>
    </ng-container>

    <ng-container matColumnDef="Sesiones">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Sesiones </th>
      <td mat-cell *matCellDef="let element"> {{element.Sesiones}} </td>
      <td mat-footer-cell *matFooterCellDef> </td>
    </ng-container>

    <ng-container matColumnDef="Sala">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Sala </th>
      <td mat-cell *matCellDef="let element"> {{element.Sala}} </td>
      <td mat-footer-cell *matFooterCellDef> </td>
    </ng-container>

    <ng-container matColumnDef="Empleado">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Empleado </th>
      <td mat-cell *matCellDef="let element"> {{element.Empleado}} </td>
      <td mat-footer-cell *matFooterCellDef> </td>
    </ng-container>

  

    <!-- <ng-container matColumnDef="ID">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
      <td mat-cell *matCellDef="let element"> {{element.ID}} </td>
      <td mat-footer-cell *matFooterCellDef>  </td>
    </ng-container> -->

    


      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns; sticky: true"></tr>

    </table>

    <mat-paginator pageSize="10" [pageSizeOptions]="[5, 10, 25, 100]" class="items-center" ></mat-paginator>
  </div>

</div>
