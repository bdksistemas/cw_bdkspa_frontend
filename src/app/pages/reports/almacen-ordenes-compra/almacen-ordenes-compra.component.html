<div class="container-all">


  <div class="mat-elevation-z8">
    <app-titulo-pagina [titulo]="titulo"></app-titulo-pagina>

    <div class="demo-button-container">
      <mat-form-field class="buscador-ticket buscador-item">
        <input matInput (keyup)="applyFilter($event.target)" placeholder="Buscar:">
      </mat-form-field>

      <div class="">
        <button (click)="downloadPDF()" mat-raised-button class="botones-acciones rojo" >
          PDF <i class="fas fa-download ml-3"></i>
        </button>
      </div>
      <div class="">
        <button (click)="downloadExcel()" mat-raised-button class="botones-acciones verde" [color]="verde">
          EXCEL <i class="fas fa-download ml-3"></i>
        </button>
      </div>



      <div class="form-floating buscador-ticket">
        <input type="date" class="form-control box-shadow-rojo borde-rojo"
        [(ngModel)]="fechaInicial"
        (change)="validarFechaInicial($event.target)"
        >
        <label for="floatingSelect">Fecha Inicial</label>
    </div>

    <div class="form-floating buscador-ticket">
      <input type="date" class="form-control box-shadow-rojo borde-rojo  "
      [(ngModel)]="fechaFinal"
      (change)="validarFechaFinal($event.target)"
      >
      <label for="floatingSelect">Fecha Final</label>
    </div>
    <div class="form-floating buscador-ticket">
      <select (change)="cambioSucusal($event)" class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
        @for (item of sucursales; track $index) {
          <option value="{{item.sucursal}}">{{item.empresa}} </option>
        }
      </select>
      <label for="floatingSelect">Selecciona Sucursal</label>
    </div>
    <div class="form-floating buscador-ticket">
      <select (change)="cambioProvedor($event)"   class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
        <option value="null">SELECCIONA UN PROVEDOR</option>
        @for (item of provedores; track $index) {
          <option value="{{item.proveedor}}">{{item.nomproveedor}} </option>
        }

      </select>
      <label for="floatingSelect">PROVEDOR</label>
    </div>

    <!-- ESTATUS: -->

    <div class="form-floating buscador-ticket">
      <select (change)="cambioEstatus($event)"   class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
        <option value="null">SELECCIONA UN ESTATUS</option>
        @for (item of estatus; track $index) {
          <option value="{{item.estatus}}">{{item.nomestatus}} </option>
        }
      </select>
      <label for="floatingSelect">ESTATUS</label>

    </div>
    <table id="my-table" mat-table [dataSource]="dataSource" matSort >

      <ng-container matColumnDef="IDOrden">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID de Orden</th>
        <td mat-cell *matCellDef="let row"> {{ row.IDOrden }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="Fecha">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha</th>
        <td mat-cell *matCellDef="let row"> {{ row.Fecha }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="Descripcion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
        <td mat-cell *matCellDef="let row"> {{ row.Descripcion }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="Proveedor">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Proveedor</th>
        <td mat-cell *matCellDef="let row"> {{ row.Proveedor }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="Estatus">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Estatus</th>
        <td mat-cell *matCellDef="let row"> {{ row.Estatus }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="ImporteTotal">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Importe Total</th>
        <td mat-cell *matCellDef="let row"> {{ row.ImporteTotal }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <!-- <ng-container matColumnDef="Pedido">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Pedido</th>
        <td mat-cell *matCellDef="let row"> {{ row.Pedido }} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container> -->


      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns; sticky: true"></tr>

    </table>

    <mat-paginator pageSize="10" [pageSizeOptions]="[5, 10, 25, 100]" class="items-center" ></mat-paginator>
  </div>

</div>
<app-banner-publicitario></app-banner-publicitario>
